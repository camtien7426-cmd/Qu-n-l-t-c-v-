<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xếp Việc – Quản lý công việc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Lexend:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff4e6;--b1:#ffb199;--b2:#ffd66b;--b3:#8fd9c4;--b4:#9bb8ff;
  --glass:rgba(255,255,255,.58);--card:rgba(255,255,255,.9);--line:rgba(60,40,30,.12);
  --text:#2b2320;--muted:#7a6a62;--accent:#ff6b4a;--accent-ink:#fff;
  --hi:#ef4444;--mid:#f59e0b;--lo:#10b981;--shadow:0 8px 28px rgba(120,70,40,.12);
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1226;--b1:#ff6b6b;--b2:#7c5cff;--b3:#14b8a6;--b4:#3b82f6;
  --glass:rgba(24,28,58,.55);--card:rgba(34,39,76,.85);--line:rgba(255,255,255,.12);
  --text:#f4f1ff;--muted:#a9a6c8;--accent:#ff8a65;--accent-ink:#1b1020;--shadow:0 8px 28px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1226;--b1:#ff6b6b;--b2:#7c5cff;--b3:#14b8a6;--b4:#3b82f6;
  --glass:rgba(24,28,58,.55);--card:rgba(34,39,76,.85);--line:rgba(255,255,255,.12);
  --text:#f4f1ff;--muted:#a9a6c8;--accent:#ff8a65;--accent-ink:#1b1020;--shadow:0 8px 28px rgba(0,0,0,.35);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:16px/1.55 'Be Vietnam Pro',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;border-radius:50%;filter:blur(80px);opacity:.75;animation:drift 22s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:46vmax;height:46vmax;background:var(--b1);left:-12vmax;top:-10vmax}
.aurora i:nth-child(2){width:38vmax;height:38vmax;background:var(--b2);right:-10vmax;top:5vmax;animation-duration:27s;animation-delay:-6s}
.aurora i:nth-child(3){width:42vmax;height:42vmax;background:var(--b3);left:15vmax;bottom:-18vmax;animation-duration:31s;animation-delay:-12s}
.aurora i:nth-child(4){width:30vmax;height:30vmax;background:var(--b4);right:8vmax;bottom:-8vmax;animation-duration:25s;animation-delay:-3s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(9vmax,6vmax) scale(1.15)}100%{transform:translate(-6vmax,10vmax) scale(.95)}}
@media (prefers-reduced-motion:reduce){.aurora i{animation:none}*{transition:none!important}}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
header{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.brand{display:flex;gap:14px;align-items:center}
.mark{width:46px;height:46px;border-radius:14px;background:var(--accent);display:grid;place-content:center;gap:4px;box-shadow:var(--shadow)}
.mark b{display:block;height:5px;border-radius:3px;background:var(--accent-ink)}
.mark b:nth-child(1){width:22px}.mark b:nth-child(2){width:15px}.mark b:nth-child(3){width:19px}
h1{font:700 clamp(1.5rem,3.4vw,2.2rem)/1.15 Lexend,sans-serif;margin:0;letter-spacing:-.01em}
.sub{margin:2px 0 0;color:var(--muted);font-size:.95rem}
.btn{font:600 1rem Lexend,sans-serif;border:0;border-radius:14px;padding:12px 20px;background:var(--accent);color:var(--accent-ink);cursor:pointer;box-shadow:var(--shadow);transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:transparent;color:var(--text);box-shadow:none;border:1px solid var(--line)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.panel{background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.bar{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;padding:14px 18px;margin-bottom:20px}
.prog{flex:1 1 240px;min-width:200px}
.prog p{margin:0 0 6px;font-weight:500;font-size:.95rem}
.track{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--lo),var(--b2));transition:width .6s cubic-bezier(.3,.9,.3,1)}
input[type=search],input[type=text],input[type=date],textarea{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;width:100%}
input[type=search]{max-width:260px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:500 .9rem 'Be Vietnam Pro',sans-serif;border:1px solid var(--line);background:transparent;color:var(--text);border-radius:99px;padding:7px 14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--text);color:var(--bg);border-color:var(--text)}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:start}
@media(max-width:860px){.board{grid-template-columns:1fr}}
.col{padding:16px 14px 14px;min-height:200px;transition:outline-color .15s;outline:3px solid transparent}
.col.over{outline-color:var(--accent)}
.col h2{font:600 1.1rem Lexend,sans-serif;margin:0 4px 12px;display:flex;align-items:center;gap:10px}
.dot{width:12px;height:12px;border-radius:50%}
.count{margin-left:auto;font:500 .85rem 'Be Vietnam Pro';color:var(--muted);background:var(--card);border-radius:99px;padding:1px 10px}
.list{display:grid;gap:10px;min-height:20px}
.card{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--p);border-radius:16px;padding:12px 14px;cursor:grab;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.card.drag{opacity:.4}
.card[data-p=hi]{--p:var(--hi)}.card[data-p=mid]{--p:var(--mid)}.card[data-p=lo]{--p:var(--lo)}
.tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);background:transparent;cursor:pointer;padding:0;position:relative;margin-top:2px}
.tick:hover{border-color:var(--lo)}
.done .tick{background:var(--lo);border-color:var(--lo)}
.done .tick::after{content:"";position:absolute;left:8px;top:3px;width:6px;height:12px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.ttl{font-weight:600;word-break:break-word}
.done .ttl{text-decoration:line-through;color:var(--muted)}
.note{grid-column:2;margin:0;color:var(--muted);font-size:.9rem}
.meta{grid-column:2;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.85rem;color:var(--muted);margin-top:4px}
.tag{font-weight:600;color:var(--p)}
.late{color:var(--hi);font-weight:600}
.acts{grid-column:2;display:flex;gap:4px;margin-top:4px}
.acts button{font:500 .85rem 'Be Vietnam Pro';background:none;border:0;color:var(--muted);padding:6px 8px;border-radius:8px;cursor:pointer}
.acts button:hover{background:var(--line);color:var(--text)}

.empty{text-align:center;color:var(--muted);font-size:.92rem;padding:22px 10px;border:2px dashed var(--line);border-radius:16px}
.addin{width:100%;margin-top:12px;background:transparent;border:2px dashed var(--line);color:var(--muted);border-radius:14px;padding:10px;font:500 .95rem 'Be Vietnam Pro';cursor:pointer}
.addin:hover{color:var(--text);border-color:var(--accent)}
dialog{border:0;border-radius:24px;padding:0;width:min(460px,92vw);background:var(--bg);color:var(--text);box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(20,10,30,.45);backdrop-filter:blur(4px)}
dialog[open]{animation:pop .22s cubic-bezier(.3,1.3,.5,1)}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.dlg{padding:24px;display:grid;gap:14px}
.dlg h3{font:700 1.3rem Lexend,sans-serif;margin:0}
label{display:grid;gap:6px;font-weight:500;font-size:.95rem}
.seg{display:flex;gap:8px}
.seg label{flex:1}
.seg input{position:absolute;opacity:0}
.seg span{display:block;text-align:center;padding:10px 6px;border-radius:12px;border:2px solid var(--line);cursor:pointer;font-weight:600}
.seg input:checked+span{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
.seg input:focus-visible+span{outline:3px solid var(--accent)}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:4px}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="mark" aria-hidden="true"><b></b><b></b><b></b></div>
      <div><h1 id="hello">Xin chào</h1><p class="sub" id="today"></p></div>
    </div>
    <button class="btn" id="new">Thêm việc mới</button>
  </header>

  <section class="panel bar" aria-label="Tổng quan và bộ lọc">
    <div class="prog"><p id="progText"></p><div class="track"><div class="fill" id="fill"></div></div></div>
    <input type="search" id="q" placeholder="Tìm công việc…" aria-label="Tìm công việc">
    <div class="chips" id="chips">
      <button class="chip" data-f="all" aria-pressed="true">Tất cả</button>
      <button class="chip" data-f="hi" aria-pressed="false">Gấp</button>
      <button class="chip" data-f="mid" aria-pressed="false">Vừa</button>
      <button class="chip" data-f="lo" aria-pressed="false">Thong thả</button>
    </div>
  </section>

  <main class="board" id="board"></main>
</div>

<dialog id="dlg">
  <form class="dlg" id="form">
    <h3 id="dTitle">Việc mới</h3>
    <label>Bạn cần làm gì?<input type="text" id="fTitle" required maxlength="80" placeholder="Ví dụ: Mua quà sinh nhật cho mẹ"></label>
    <label>Ghi chú (không bắt buộc)<textarea id="fNote" rows="2" maxlength="200"></textarea></label>
    <div>
      <div style="font-weight:500;font-size:.95rem;margin-bottom:6px">Mức độ quan trọng</div>
      <div class="seg">
        <label style="--c:var(--hi)"><input type="radio" name="pri" value="hi"><span>Gấp</span></label>
        <label style="--c:var(--mid)"><input type="radio" name="pri" value="mid" checked><span>Vừa</span></label>
        <label style="--c:var(--lo)"><input type="radio" name="pri" value="lo"><span>Thong thả</span></label>
      </div>
    </div>
    <label>Hạn hoàn thành<input type="date" id="fDue"></label>
    <div class="row"><button type="button" class="btn ghost" id="cancel">Để sau</button><button class="btn" type="submit">Lưu việc</button></div>
  </form>
</dialog>

<script>
(function(){
  var COLS=[{id:'todo',name:'Cần làm',color:'var(--b4)'},{id:'doing',name:'Đang làm',color:'var(--mid)'},{id:'done',name:'Đã xong',color:'var(--lo)'}];
  var PRI={hi:'Gấp',mid:'Vừa',lo:'Thong thả'};
  var KEY='xepviec.tasks.v1';
  function iso(d){var o=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return o.toISOString().slice(0,10)}
  function plus(n){var d=new Date();d.setDate(d.getDate()+n);return iso(d)}
  var tasks=[];
  try{var raw=localStorage.getItem(KEY);if(raw)tasks=JSON.parse(raw)}catch(e){}
  if(!tasks.length)tasks=[
    {id:1,title:'Gửi báo cáo tuần cho cô Lan',note:'Đính kèm bảng số liệu mới nhất',status:'todo',pri:'hi',due:plus(0)},
    {id:2,title:'Đặt lịch khám răng cho bé',note:'',status:'todo',pri:'mid',due:plus(3)},
    {id:3,title:'Ôn bài kiểm tra Toán',note:'Chương 4 và 5',status:'doing',pri:'hi',due:plus(1)},
    {id:4,title:'Chọn quà sinh nhật cho mẹ',note:'Mẹ thích hoa và trà thơm',status:'doing',pri:'lo',due:plus(6)},
    {id:5,title:'Dọn dẹp góc làm việc',note:'',status:'done',pri:'lo',due:''}
  ];
  var greet=(function(){
    var today=iso(new Date()),hr=new Date().getHours();
    var late=tasks.filter(function(t){return t.status!=='done'&&t.due&&t.due<today}).length;
    var open=tasks.filter(function(t){return t.status!=='done'}).length;
    var pool;
    if(late)pool=['Ê, có '+late+' việc trễ hạn rồi đó. Mình buồn lắm nha!','Việc quá hạn đang nhìn bạn kìa. Làm một việc nhỏ thôi cũng được!','Deadline đi qua rồi mà việc vẫn ở lại. Xử lý nhé bạn ơi!'];
    else if(tasks.length&&!open)pool=['Xong hết rồi! Hôm nay bạn đỉnh thật đó.','Sạch bóng việc luôn. Nghỉ ngơi xứng đáng nha!'];
    else pool=['Alo alo, đến giờ làm việc rồi bạn ơi!','Bạn ơi, việc không tự làm đâu nha!','Làm một việc thôi rồi muốn nghỉ cũng được.','Mình đang chờ bạn đánh dấu xong một việc đó.','Đừng để mai mới làm, mai còn việc của mai nữa!','Vào rồi mà chưa làm gì hả? Bắt đầu thôi nào!'];
    if(hr>=22||hr<5)pool=pool.concat(['Khuya rồi mà còn làm việc hả? Xong việc này rồi đi ngủ nha!']);
    return pool[Math.floor(Math.random()*pool.length)];
  })();
  var filter='all',query='',dragId=null,editId=null,addStatus='todo';
  function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function dueText(t){
    if(!t.due)return '';
    var diff=Math.round((new Date(t.due+'T00:00:00')-new Date(iso(new Date())+'T00:00:00'))/864e5);
    if(t.status!=='done'){
      if(diff<0)return '<span class="late">Quá hạn '+(-diff)+' ngày</span>';
      if(diff===0)return '<span class="late">Hạn hôm nay</span>';
      if(diff===1)return '<span>Hạn ngày mai</span>';
    }
    var p=t.due.split('-');return '<span>Hạn '+p[2]+'/'+p[1]+'</span>';
  }
  function card(t,ci){
    
    
    return '<article class="card'+(t.status==='done'?' done':'')+'" draggable="true" data-id="'+t.id+'" data-p="'+t.pri+'">'+
      '<button class="tick" data-a="tick" aria-label="'+(t.status==='done'?'Đánh dấu chưa xong':'Đánh dấu đã xong')+'"></button>'+
      '<div class="ttl">'+esc(t.title)+'</div>'+
      (t.note?'<p class="note">'+esc(t.note)+'</p>':'')+
      '<div class="meta"><span class="tag">'+PRI[t.pri]+'</span>'+dueText(t)+'</div>'+
      '<div class="acts"><button data-a="edit">Sửa</button><button data-a="del">Xóa</button></div></article>';
  }
  function render(){
    var h=new Date().getHours();
    document.getElementById('hello').textContent=greet;
    document.getElementById('today').textContent=new Date().toLocaleDateString('vi-VN',{weekday:'long',day:'numeric',month:'long'});
    var out='';
    COLS.forEach(function(c,ci){
      var list=tasks.filter(function(t){
        return t.status===c.id&&(filter==='all'||t.pri===filter)&&(!query||(t.title+' '+t.note).toLowerCase().indexOf(query)>-1)});
      out+='<section class="panel col" data-col="'+c.id+'"><h2><span class="dot" style="background:'+c.color+'"></span>'+c.name+'<span class="count">'+list.length+'</span></h2>'+
        '<div class="list">'+(list.length?list.map(function(t){return card(t,ci)}).join(''):'<div class="empty">Chưa có việc nào. Kéo thả một việc vào đây nhé.</div>')+'</div>'+
        '<button class="addin" data-add="'+c.id+'">Thêm việc vào “'+c.name+'”</button></section>';
    });
    document.getElementById('board').innerHTML=out;
    var done=tasks.filter(function(t){return t.status==='done'}).length,all=tasks.length;
    document.getElementById('fill').style.width=(all?done/all*100:0)+'%';
    document.getElementById('progText').textContent=all?('Bạn đã xong '+done+' trên '+all+' việc'+(done===all?'. Tuyệt vời!':'.')):'Hãy thêm việc đầu tiên của bạn.';
  }
  function move(id,status){var t=tasks.find(function(x){return x.id===id});if(t&&t.status!==status){t.status=status;save();render()}}
  var board=document.getElementById('board'),dlg=document.getElementById('dlg');
  board.addEventListener('click',function(e){
    var add=e.target.closest('[data-add]');if(add){openDlg(null,add.dataset.add);return}
    var b=e.target.closest('[data-a]');if(!b)return;
    var el=b.closest('.card'),id=+el.dataset.id,t=tasks.find(function(x){return x.id===id}),ci=COLS.findIndex(function(c){return c.id===t.status}),a=b.dataset.a;
    if(a==='tick')move(id,t.status==='done'?'todo':'done');
    else if(a==='edit')openDlg(t);
    else if(a==='del'&&confirm('Xóa việc “'+t.title+'”?')){tasks=tasks.filter(function(x){return x.id!==id});save();render()}
  });
  board.addEventListener('dragstart',function(e){var c=e.target.closest('.card');if(!c)return;dragId=+c.dataset.id;c.classList.add('drag');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',String(dragId))}catch(x){}});
  board.addEventListener('dragend',function(){dragId=null;render()});
  board.addEventListener('dragover',function(e){var col=e.target.closest('.col');if(!col)return;e.preventDefault();document.querySelectorAll('.col.over').forEach(function(x){if(x!==col)x.classList.remove('over')});col.classList.add('over')});
  board.addEventListener('drop',function(e){var col=e.target.closest('.col');if(!col)return;e.preventDefault();if(dragId!=null)move(dragId,col.dataset.col)});
  function openDlg(t,status){
    editId=t?t.id:null;addStatus=status||'todo';
    document.getElementById('dTitle').textContent=t?'Sửa việc':'Việc mới';
    document.getElementById('fTitle').value=t?t.title:'';
    document.getElementById('fNote').value=t?t.note:'';
    document.getElementById('fDue').value=t?t.due:'';
    document.querySelector('input[name=pri][value='+(t?t.pri:'mid')+']').checked=true;
    dlg.showModal();document.getElementById('fTitle').focus();
  }
  document.getElementById('new').onclick=function(){openDlg(null,'todo')};
  document.getElementById('cancel').onclick=function(){dlg.close()};
  document.getElementById('form').addEventListener('submit',function(e){
    e.preventDefault();
    var d={title:document.getElementById('fTitle').value.trim(),note:document.getElementById('fNote').value.trim(),due:document.getElementById('fDue').value,pri:document.querySelector('input[name=pri]:checked').value};
    if(!d.title)return;
    if(editId){Object.assign(tasks.find(function(x){return x.id===editId}),d)}
    else{tasks.push(Object.assign({id:Date.now(),status:addStatus},d))}
    save();dlg.close();render();
  });
  document.getElementById('q').addEventListener('input',function(e){query=e.target.value.trim().toLowerCase();render()});
  document.getElementById('chips').addEventListener('click',function(e){
    var b=e.target.closest('.chip');if(!b)return;filter=b.dataset.f;
    document.querySelectorAll('.chip').forEach(function(c){c.setAttribute('aria-pressed',c===b)});render();
  });
  render();
})();
</script>
</body>
</html>
